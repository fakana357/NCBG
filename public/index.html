function chatHtml(id) { return `<div class="chat" id="${id}"><div class="chat-log">${chatLines()}</div><form class="chat-f"><input maxlength="200" placeholder="Message" autocomplete="off"><button>SEND</button></form></div>`; }
function chatLines() { return NET.chat.map(m => `<div class="chat-m"><b>${esc(m.from)}</b> ${esc(m.text)}</div>`).join(''); }
function chatBind(el) {
  if (!el) return;
  const log = el.querySelector('.chat-log'); log.scrollTop = log.scrollHeight;
  el.querySelector('form').onsubmit = e => { e.preventDefault(); const i = el.querySelector('input'); const t = i.value.trim(); if (t) netSend({ t: 'chat', text: t }); i.value = ''; i.focus(); };
  el.querySelector('input').addEventListener('keydown', e => e.stopPropagation());
}
function chatAdd(m) {
  NET.chat.push(m); if (NET.chat.length > 100) NET.chat.shift();
  document.querySelectorAll('.chat .chat-log').forEach(log => { const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 30; log.innerHTML = chatLines(); if (stick) log.scrollTop = log.scrollHeight; });
  const panel = $('#gameChat');
  if (NET.on && G && (!panel || panel.classList.contains('hidden'))) { NET.unread++; const bc = $('#bChat'); if (bc) bc.innerHTML = `✉<b class="chatn">${NET.unread}</b>`; }
}
function chatToggle() {
  let p = $('#gameChat');
  if (!p) { p = document.createElement('div'); p.id = 'gameChat'; p.className = 'hidden'; p.innerHTML = chatHtml('gameChatBox') + '<button class="chat-x">✕</button>'; document.body.appendChild(p); chatBind(p.querySelector('.chat')); p.querySelector('.chat-x').onclick = () => chatToggle(); }
  p.classList.toggle('hidden');
  if (!p.classList.contains('hidden')) { NET.unread = 0; const bc = $('#bChat'); if (bc) bc.textContent = '✉'; const log = p.querySelector('.chat-log'); log.innerHTML = chatLines(); log.scrollTop = log.scrollHeight; p.querySelector('input').focus(); }
}
// invite link: ?room=CODE
try {
  const rc = window.NCBG_ONLINE && new URLSearchParams(location.search).get('room');
  if (rc) { NET.autoJoin = rc.toUpperCase(); history.replaceState(null, '', location.pathname); setTimeout(() => { if (phase === 'menu') openOnline(); }, 400); }
} catch (e) { }

B.hooks.onEvent = (type, data) => {
  if (type === 'scan' && data === me) setTimeout(() => {
    const o = G.players.find(p => p.id === me.nextOpp) || (G.pairs || []).flat().find(x => x.isGhost);
    if (!o) return;
    const bd = o.board || [];
    showTip(`<div class="tbox" style="max-width:none"><b>Scan: ${o.name}</b><div class="meta">${o.hero.name} · Tier ${o.tier} · ${bd.length} minions right now</div><div class="peekrow" style="--cw:130px;border:none;padding:0;max-width:min(1100px,80vw)">${bd.map((m, i) => minionEl(m, 'peekx', i)).join('')}</div><div class="meta">Click anywhere to close.</div></div>`, $('#powerBtn'), true);
    S.justOpened = true; setTimeout(() => S.justOpened = false, 80);
  }, 30);
  if (type === 'pending' && data === me && phase === 'recruit') setTimeout(render, 0);
  if (type === 'psycho' && data.p === me) setTimeout(() => { const el = document.querySelector(`#board [data-uid="${data.m.uid}"]`); if (el) { pulse(el, 'gopsycho', 900); const r = el.getBoundingClientRect(); sparks(r.left + r.width / 2, r.top + r.height / 2, 26, '#ff003c'); } }, 60);
  if (type === 'maxtac' && data.p === me) (S.maxtacQ = S.maxtacQ || []).push(data.m);
  if (type === 'clone' && data.p === me && phase === 'recruit') setTimeout(() => { const el = document.querySelector(`#board [data-uid="${data.m.uid}"]`); if (el) { pulse(el, 'buffed', 700); const r = el.getBoundingClientRect(); ring(r.left + r.width / 2, r.top + r.height / 2, '#2fd6ae'); } }, 80);
  if ((type === 'engram' || type === 'upload') && data.p === me && data.m) setTimeout(() => { const el = document.querySelector(`#board [data-uid="${data.m.uid}"]`); if (el) { pulse(el, 'buffed', 700); const r = el.getBoundingClientRect(); ring(r.left + r.width / 2, r.top + r.height / 2, '#e0002a'); } }, 60);
};
window.addEventListener('resize', () => { if (phase === 'recruit') render(); });
mainMenu();
})();
</script><script>// ---------- visual layer: background shader, card tilt, hit flashes ----------
(function () {
  const FX = window.FX = { hit: 0, hitCol: [1, .1, .3] };

  // ---- WebGL night-city backdrop: skyline, neon haze, rain, scanlines; chromatic split on hits ----
  function startShader() {
    const cv = document.createElement('canvas'); cv.id = 'bgfx';
    document.body.prepend(cv);
    const gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'low-power' });
    if (!gl) { cv.remove(); return; }
    document.documentElement.classList.add('has-bgfx');
    const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
    const fs = `precision mediump float;
uniform vec2 R;uniform float T;uniform float H;uniform vec3 HC;uniform vec2 M;
float h1(float x){return fract(sin(x*127.1)*43758.5453);}
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n2(p);p*=2.03;a*=.5;}return v;}
vec3 city(vec2 uv,float shift){
  vec3 c=vec3(.024,.024,.05);
  c+=vec3(.22,.04,.16)*smoothstep(1.1,0.,length((uv-vec2(.5,-.15))*vec2(1.,1.6)));
  c+=vec3(.0,.12,.15)*smoothstep(.9,0.,length(uv-vec2(-.05,1.05)));
  c+=vec3(.12,.1,.0)*.35*smoothstep(.8,0.,length(uv-vec2(1.05,1.0)));
  float hz=fbm(vec2(uv.x*3.+T*.02,uv.y*2.-T*.015));
  c+=vec3(.25,.05,.2)*hz*hz*.22+vec3(.02,.18,.2)*pow(fbm(uv*4.+vec2(-T*.03,0.)),3.)*.35;
  for(int L=0;L<3;L++){
    float l=float(L);float sc=10.+l*9.;float x=(uv.x+M.x*(.006+l*.006)+shift*.003)*sc+l*17.;
    float id=floor(x);float bh=.22+.5*h1(id+l*31.)*(1.-l*.25);bh*=.6+.4*h1(id*1.7+l);
    float top=bh*(.62-l*.1);
    if(uv.y<top){
      vec3 bc=mix(vec3(.04,.03,.08),vec3(.012,.012,.03),l/2.);
      vec2 w=vec2(fract(x)*6.,uv.y*sc*2.4);vec2 wi=floor(w);
      float on=step(.78,h2(wi+id*7.+l*3.))*step(.15,fract(w.x))*step(.25,fract(w.y));
      float fl=.6+.4*sin(T*(1.+h2(wi)*3.)+h2(wi*3.)*6.);
      vec3 wc=mix(vec3(1.,.15,.5),vec3(.1,.85,1.),h2(wi+id));wc=mix(wc,vec3(1.,.85,.2),step(.85,h2(wi*1.3+id)));
      bc+=wc*on*fl*(.22-l*.06);
      float edge=smoothstep(.006,0.,abs(uv.y-top))*step(.6,h1(id*2.3+l));
      bc+=mix(vec3(1.,.1,.45),vec3(.0,.9,1.),h1(id+5.))*edge*.6;
      c=mix(c,bc,.92);
    }
  }
  return c;
}
void main(){
  vec2 uv=gl_FragCoord.xy/R;float a=R.x/R.y;
  float ca=H*.012;
  vec3 c;
  c.r=city(uv+vec2(ca,0.),1.).r;c.g=city(uv,0.).g;c.b=city(uv-vec2(ca,0.),-1.).b;
  vec2 ru=vec2(uv.x*a,uv.y);
  float rain=0.;
  for(int k=0;k<3;k++){float fk=float(k);float s=55.+fk*40.;vec2 q=vec2(ru.x*s+fk*13.,ru.y*(3.+fk)+T*(1.4+fk*.6)+ru.x*.6);
    float col=floor(q.x);float r=h1(col+fk*91.);float y=fract(q.y+r*7.);
    float drop=smoothstep(.0,.04,y)*smoothstep(.22+r*.2,.04,y)*smoothstep(.5,.0,abs(fract(q.x)-.5)*4.);
    rain+=drop*step(.55,r)*(.5-fk*.12);}
  c+=vec3(.55,.75,1.)*rain*.09;
  c+=HC*H*.18*(1.-length(uv-.5));
  c*=.92+.08*sin(gl_FragCoord.y*1.6);
  c*=1.-.45*pow(length((uv-.5)*vec2(1.,1.2)),2.2);
  gl_FragColor=vec4(c,1.);
}`;
    const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
    let pr;
    try { pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); } catch (e) { cv.remove(); document.documentElement.classList.remove('has-bgfx'); return; }
    gl.useProgram(pr);
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = n => gl.getUniformLocation(pr, n); const uR = U('R'), uT = U('T'), uH = U('H'), uHC = U('HC'), uM = U('M');
    const mouse = [0, 0], mt = [0, 0];
    addEventListener('pointermove', e => { mt[0] = e.clientX / innerWidth - .5; mt[1] = e.clientY / innerHeight - .5; }, { passive: true });
    const size = () => { const s = Math.min(.6, 900 / Math.max(innerWidth, innerHeight)); cv.width = Math.max(2, Math.round(innerWidth * s)); cv.height = Math.max(2, Math.round(innerHeight * s)); gl.viewport(0, 0, cv.width, cv.height); };
    size(); addEventListener('resize', size);
    const t0 = performance.now(); let last = 0;
    const frame = now => {
      requestAnimationFrame(frame);
      if (document.hidden || now - last < 33) return; last = now;
      mouse[0] += (mt[0] - mouse[0]) * .06; mouse[1] += (mt[1] - mouse[1]) * .06;
      FX.hit *= .88; if (FX.hit < .01) FX.hit = 0;
      gl.uniform2f(uR, cv.width, cv.height); gl.uniform1f(uT, (now - t0) / 1000); gl.uniform1f(uH, FX.hit); gl.uniform3fv(uHC, FX.hitCol); gl.uniform2f(uM, mouse[0], mouse[1]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };
    requestAnimationFrame(frame);
  }
  FX.flash = (strength, col) => { FX.hit = Math.min(1.5, FX.hit + (strength || 1)); if (col) FX.hitCol = col; };

  // ---- pseudo-3D cards: tilt toward the pointer, art parallax, holographic glare ----
  let cur = null;
  const reset = el => { if (!el) return; el.classList.remove('tilt'); el.style.removeProperty('--rx'); el.style.removeProperty('--ry'); el.style.removeProperty('--ga'); };
  function tiltAt(x, y, target) {
    const el = target && target.closest ? target.closest('.card') : null;
    if (el !== cur) { reset(cur); cur = el; }
    if (!el || el.classList.contains('dragghost') || el.classList.contains('dragging') || el.closest('#duel') || document.querySelector('.dragghost')) { if (el) reset(el); return; }
    const r = el.getBoundingClientRect(); if (!r.width) return;
    const nx = Math.max(-1, Math.min(1, (x - r.left) / r.width * 2 - 1)), ny = Math.max(-1, Math.min(1, (y - r.top) / r.height * 2 - 1));
    if (!el.querySelector(':scope > .glare')) { const g = document.createElement('i'); g.className = 'glare'; el.appendChild(g); }
    el.classList.add('tilt');
    el.style.setProperty('--rx', (-ny * 9).toFixed(2));
    el.style.setProperty('--ry', (nx * 11).toFixed(2));
    el.style.setProperty('--gx', ((nx + 1) * 50).toFixed(1) + '%');
    el.style.setProperty('--gy', ((ny + 1) * 50).toFixed(1) + '%');
    el.style.setProperty('--ga', (.35 + .4 * Math.hypot(nx, ny) / 1.41).toFixed(2));
  }
  addEventListener('pointermove', e => tiltAt(e.clientX, e.clientY, e.target), { passive: true });
  addEventListener('pointerdown', e => tiltAt(e.clientX, e.clientY, e.target), { passive: true });
  addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') { reset(cur); cur = null; } }, { passive: true });
  addEventListener('pointercancel', () => { reset(cur); cur = null; }, { passive: true });
  document.addEventListener('pointerleave', () => { reset(cur); cur = null; });

  // ---- screen transitions: a short glitch whenever a screen opens ----
  FX.glitchIn = el => { if (!el) return; el.classList.remove('glitchin'); void el.offsetWidth; el.classList.add('glitchin'); setTimeout(() => el.classList.remove('glitchin'), 520); };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startShader); else startShader();
})();
